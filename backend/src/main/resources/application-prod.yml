spring:
  servlet:
    multipart:
      max-file-size: ${STORAGE_MEDIA_MAX_FILE_SIZE:104857600}
      max-request-size: ${STORAGE_MEDIA_MAX_FILE_SIZE:10485760}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  frontend:
    url: ${APP_FRONTEND_URL}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:${APP_FRONTEND_URL}}

  mail:
    hr-recipient: ${MAIL_HR_RECIPIENT}

  pagination:
    default-page-size: 10
    max-page-size: 100

  storage:
    provider: ${STORAGE_PROVIDER:CLOUDINARY}
    local-directory: ${STORAGE_LOCAL_DIRECTORY:/tmp/hirevibe}
    max-file-size: ${STORAGE_MAX_FILE_SIZE:5242880}
    media-max-file-size: ${STORAGE_MEDIA_MAX_FILE_SIZE:104857600}
    allowed-resume-extensions:
      - pdf
      - doc
      - docx

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

    root-folder: ${CLOUDINARY_ROOT_FOLDER:hirevibe}
    resume-folder: ${CLOUDINARY_RESUME_FOLDER:resumes}
    article-image-folder: ${CLOUDINARY_ARTICLE_IMAGE_FOLDER:article-images}
    video-thumbnail-folder: ${CLOUDINARY_VIDEO_THUMBNAIL_FOLDER:video-thumbnails}
    video-folder: ${CLOUDINARY_VIDEO_FOLDER:videos}
    general-folder: ${CLOUDINARY_GENERAL_FOLDER:general}

    signed-url-expiration-seconds: ${CLOUDINARY_SIGNED_URL_EXPIRATION_SECONDS:900}

server:
  forward-headers-strategy: framework

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false